[package]
name = "mobilee"
version = "2.2.1"
description = "Local Android and iOS mobile security assessment workbench"
authors = ["swyiic"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mobilee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
zip = "2.4"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
ksight-core = { git = "https://github.com/swyiic/KernSight.git", tag = "v0.2.10" }
ksight-model = { git = "https://github.com/swyiic/KernSight.git", tag = "v0.2.10" }
ksight-protocol = { git = "https://github.com/swyiic/KernSight.git", tag = "v0.2.10" }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
